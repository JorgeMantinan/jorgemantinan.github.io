name: Sincronizar desde css-grid

# Este repo es un espejo publico de la rama master de JorgeMantinan/css-grid
# (repo PRIVADO: hace falta el secreto CSS_GRID_TOKEN, PAT fine-grained con
# Contents: Read-only sobre css-grid). Se refleja cada 30 minutos o a mano.
# NOTA: el contexto "secrets" NO vale en los if de un step (dan error de
# validacion "Unrecognized named-value" y el run ni siquiera crea jobs); por
# eso se copia al env del job y se comprueba env.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CSS_GRID_TOKEN: ${{ secrets.CSS_GRID_TOKEN }}
    steps:
      - name: Descargar este repo
        uses: actions/checkout@v4

      - name: Aviso si falta el secreto CSS_GRID_TOKEN
        if: ${{ env.CSS_GRID_TOKEN == '' }}
        run: echo "::warning::Falta el secreto CSS_GRID_TOKEN (PAT de solo lectura para JorgeMantinan/css-grid). El espejo NO se sincroniza hasta que se cree."

      - name: Descargar css-grid (master = produccion)
        if: ${{ env.CSS_GRID_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: JorgeMantinan/css-grid
          ref: master
          path: sitio
          token: ${{ secrets.CSS_GRID_TOKEN }}

      - name: Reflejar el sitio
        if: ${{ env.CSS_GRID_TOKEN != '' }}
        run: |
          rsync -a --delete --exclude ".git" --exclude ".github" --exclude ".gitignore" sitio/ ./
          grep -qxF "sitio/" .gitignore || echo "sitio/" >> .gitignore

      - name: Commit y push
        if: ${{ env.CSS_GRID_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: el espejo ya esta al dia"
          else
            git commit -m "sync: css-grid@$(git -C sitio rev-parse --short HEAD)"
            git push
          fi
